<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Arena - Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell game-shell">
    <header class="card game-header">
      <div>
        <p class="eyebrow">Live match</p>
        <h1>Game Room</h1>
        <p id="roomMeta">Loading room...</p>
      </div>
      <a class="secondary-link" href="leaderboard.html">Leaderboard</a>
    </header>

    <section class="grid-two">
      <article class="card question-card">
        <div class="status-row">
          <span id="gameStatus" class="status-pill">Waiting</span>
          <span id="timer" class="timer-pill">20s</span>
        </div>
        <h2 id="questionText">Waiting for the next question...</h2>
        <form id="answerForm" class="answers-form">
          <div id="answerOptions" class="answer-list"></div>
          <button type="submit">Submit Answer</button>
        </form>
        <p id="answerFeedback" class="feedback"></p>
      </article>

      <aside class="card score-card">
        <h2>Your Score</h2>
        <p id="playerScore" class="score-value">0</p>
        <h3>Players</h3>
        <ul id="playerList" class="player-list"></ul>
      </aside>
    </section>
  </main>

  <script type="module" src="game.js"></script>
</body>
</html>
